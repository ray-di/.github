# GitHub Actions workflow specifically designed for running PHPUnit tests
# This workflow is optimized to install only the necessary dependencies for PHPUnit
# and explicitly avoids installing development tools to prevent latest PHP compatibility issues

name: Continuous Integration

on:
  push:
    paths-ignore:
      - '**.md'  # Skip workflow on documentation changes only
  pull_request:
  workflow_dispatch:  # Enable manual trigger
  workflow_call:      # Enable calling from other workflows
    inputs:
      old_stable:
        required: false
        type: string
        default: "[]"
      current_stable:
        required: true
        type: string
      script:
        required: false
        type: string

env:
  COMPOSER_FLAGS: "--ansi --no-interaction --no-progress --prefer-dist --no-plugins"
  COMPOSER_UPDATE_FLAGS: ""

jobs:
  # Generate matrix dynamically based on inputs
  matrix-generator:
    name: Generate Test Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: generate
        uses: actions/github-script@v7
        with:
          script: |
            const oldStable = ${{ inputs.old_stable }};
            const currentStable = "${{ inputs.current_stable }}";
            
            let matrix = {
              include: []
            };
            
            // Add old stable versions if provided
            if (oldStable.length > 0) {
              for (const version of oldStable) {
                matrix.include.push({
                  "php-version": version,
                  "os": "ubuntu-latest",
                  "dependencies": "highest",
                  "experimental": false
                });
                matrix.include.push({
                  "php-version": version,
                  "os": "ubuntu-latest",
                  "dependencies": "lowest",
                  "experimental": false
                });
              }
            }
            
            // Always add current stable tests
            matrix.include.push({
              "php-version": currentStable,
              "os": "windows-latest",
              "dependencies": "highest",
              "experimental": false
            });
            matrix.include.push({
              "php-version": currentStable,
              "os": "ubuntu-latest",
              "dependencies": "highest",
              "experimental": false
            });
            matrix.include.push({
              "php-version": currentStable,
              "os": "ubuntu-latest",
              "dependencies": "lowest",
              "experimental": false
            });
            
            core.setOutput('matrix', JSON.stringify(matrix));

  phpunit:
    name: PHPUnit - PHP ${{ matrix.php-version }} (${{ matrix.os }}, ${{ matrix.dependencies }})
    needs: matrix-generator
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-generator.outputs.matrix) }}

    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Disable autocrlf on Windows
        if: contains(matrix.os, 'windows')
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          ini-values: |
            zend.assertions=1
            memory_limit=512M
            opcache.jit=0
            opcache.jit_buffer_size=0
            opcache.enable=0
            opcache.enable_cli=0
          extensions: fileinfo,pdo,pdo_mysql,pdo_sqlite

      - name: Check fileinfo extension
        run: php --ri fileinfo

      # Setup Composer cache for faster dependency installation
      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-
            ${{ runner.os }}-composer-

      # Ensure platform requirements are properly set
      - name: Set platform requirements
        shell: bash
        run: |
          composer config platform.php ${{ matrix.php-version }}

      # Configure dependency installation based on test matrix
      - name: Handle lowest dependencies update
        if: matrix.dependencies == 'lowest'
        shell: bash
        run: echo COMPOSER_UPDATE_FLAGS="$COMPOSER_UPDATE_FLAGS --prefer-lowest" >> $GITHUB_ENV

      - name: Remove platform config for dependency resolution
        if: matrix.dependencies == 'highest'
        shell: bash
        run: composer config platform --unset

      # Install dependencies using configured flags
      - name: Update dependencies
        shell: bash
        run: |
          # Validate composer.json before proceeding
          composer validate --no-check-all --strict
          composer update ${{ env.COMPOSER_UPDATE_FLAGS }} ${{ env.COMPOSER_FLAGS }}

      # Run PHPUnit tests and generate coverage report
      - name: Run test suite
        shell: bash
        run: vendor/bin/phpunit --coverage-clover=coverage.xml
        env:
          XDEBUG_MODE: coverage

      # Upload coverage data to Codecov
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false  # Don't fail if coverage upload fails

      # Execute additional custom scripts if provided
      - name: Run additional script
        if: inputs.script != ''
        shell: bash
        run: php ${{ inputs.script }}
